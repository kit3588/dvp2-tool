name: Bump hmi-build manifest

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bump-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate hmi-build app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HMI_BUILD_APP_ID }}
          private-key: ${{ secrets.HMI_BUILD_APP_PRIVATE_KEY }}
          owner: kit3588
          repositories: hmi-build

      - name: Checkout hmi-build
        uses: actions/checkout@v4
        with:
          repository: kit3588/hmi-build
          token: ${{ steps.app-token.outputs.token }}
          path: hmi-build

      - name: Update manifest key
        run: |
          set -euo pipefail
          cd hmi-build
          if [ ! -f manifest.yaml ]; then
            echo "manifest.yaml not found in kit3588/hmi-build" >&2
            exit 1
          fi
          python3 - "$GITHUB_SHA" << 'PYEOF'
          import re
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          key = "dvp2-tool"
          path = Path("manifest.yaml")
          lines = path.read_text().splitlines(keepends=True)
          pattern = re.compile(rf"^{re.escape(key)}:\s*.*$")
          found = False
          for i, line in enumerate(lines):
              if pattern.match(line):
                  lines[i] = f"{key}: {sha}\n"
                  found = True
                  break
          if not found:
              lines.append(f"{key}: {sha}\n")
          path.write_text("".join(lines))
          PYEOF

      - name: Open or update PR against hmi-build
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: hmi-build
          commit-message: "chore: bump dvp2-tool to ${{ github.sha }}"
          branch: bump-dvp2-tool-manifest
          delete-branch: true
          title: "chore: bump dvp2-tool to ${{ github.sha }}"
          body: |
            Automated manifest bump triggered by push to `dvp2-tool@main`.

            Commit: ${{ github.sha }}

      - name: Merge manifest PR
        if: steps.create-pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          pr="${{ steps.create-pr.outputs.pull-request-number }}"
          # hmi-build is a private repo on GitHub Free, which doesn't support
          # the native auto-merge feature (`--auto` fails hard with "Auto
          # merge is not allowed for this repository"). Plain squash merge
          # instead, retrying a few times since GitHub's mergeable_state can
          # briefly be unresolved right after create-pull-request opens/
          # updates the PR.
          for i in 1 2 3 4 5; do
            if gh pr merge "$pr" --repo kit3588/hmi-build --squash; then
              exit 0
            fi
            echo "merge attempt $i failed, retrying in 5s..." >&2
            sleep 5
          done
          echo "gave up merging PR #$pr after 5 attempts" >&2
          exit 1
