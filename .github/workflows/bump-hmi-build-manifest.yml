name: Bump hmi-build manifest

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bump-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout hmi-build
        uses: actions/checkout@v4
        with:
          repository: kit3588/hmi-build
          token: ${{ secrets.HMI_BUILD_PAT }}
          path: hmi-build

      - name: Update manifest key
        run: |
          set -euo pipefail
          cd hmi-build
          if [ ! -f manifest.yaml ]; then
            echo "manifest.yaml not found in kit3588/hmi-build" >&2
            exit 1
          fi
          python3 - "$GITHUB_SHA" << 'PYEOF'
          import re
          import sys
          from pathlib import Path

          sha = sys.argv[1]
          key = "dvp2-tool"
          path = Path("manifest.yaml")
          lines = path.read_text().splitlines(keepends=True)
          pattern = re.compile(rf"^{re.escape(key)}:\s*.*$")
          found = False
          for i, line in enumerate(lines):
              if pattern.match(line):
                  lines[i] = f"{key}: {sha}\n"
                  found = True
                  break
          if not found:
              lines.append(f"{key}: {sha}\n")
          path.write_text("".join(lines))
          PYEOF

      - name: Open or update PR against hmi-build
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.HMI_BUILD_PAT }}
          path: hmi-build
          commit-message: "chore: bump dvp2-tool to ${{ github.sha }}"
          branch: bump-dvp2-tool-manifest
          delete-branch: true
          title: "chore: bump dvp2-tool to ${{ github.sha }}"
          body: |
            Automated manifest bump triggered by push to `dvp2-tool@main`.

            Commit: ${{ github.sha }}
